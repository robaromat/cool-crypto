name: Mise à jour mensuelle du signal

on:
  schedule:
    - cron: "0 1 1 * *"   # le 1er de chaque mois à 01:00 UTC = 03:00 Paris (été), après clôture de Wall Street
                          # (US close ~20:00-21:00 UTC la veille). Heure creuse -> moins de délai GitHub. Hiver: 02:00 Paris.
  workflow_dispatch: {}    # bouton "Run" manuel

permissions:
  contents: write

concurrency:
  group: monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculer le signal BTC et régénérer le site
        run: python engine/update.py

      - name: Calculer le signal ETH et régénérer le site
        run: python engine/update_eth.py

      - name: Calculer le signal LQQ et régénérer le site
        run: python engine/update_lqq.py

      - name: Calculer le portefeuille consolidé (après les 3 moteurs)
        run: python engine/update_portfolio.py

      - name: Commit si changement
        run: |
          git config user.name "cool-crypto bot"
          git config user.email "actions@github.com"
          git add docs/ engine/ndx_cache.csv
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "chore: mise à jour mensuelle du signal ($(date -u +%Y-%m-%d))"
            git push
          fi
